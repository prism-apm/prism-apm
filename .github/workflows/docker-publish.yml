name: Build and publish Docker images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Test projects
    runs-on: ubuntu-24.04

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the stable SemVer format vMAJOR.MINOR.PATCH (for example, v1.2.3)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test Java projects
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -pl prism-apm-parser,prism-apm-ui-server \
            -am clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prism-apm-ui/package-lock.json

      - name: Validate frontend build
        working-directory: prism-apm-ui
        run: |
          npm ci
          npm run build

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build and push images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Java projects
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -pl prism-apm-parser,prism-apm-ui-server \
            -am clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prism-apm-ui/package-lock.json

      - name: Build frontend
        working-directory: prism-apm-ui
        run: |
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push parser image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./prism-apm-parser/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            prsimapm/prism-apm-parser:${{ github.ref_name }}
            prsimapm/prism-apm-parser:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=prism-apm-parser
          cache-to: type=gha,mode=max,scope=prism-apm-parser

      - name: Build and push UI server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./prism-apm-ui-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            prsimapm/prism-apm-ui-server:${{ github.ref_name }}
            prsimapm/prism-apm-ui-server:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=prism-apm-ui-server
          cache-to: type=gha,mode=max,scope=prism-apm-ui-server

      - name: Build and push UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./prism-apm-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            prsimapm/prism-apm-ui:${{ github.ref_name }}
            prsimapm/prism-apm-ui:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=prism-apm-ui
          cache-to: type=gha,mode=max,scope=prism-apm-ui
