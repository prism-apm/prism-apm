spring.application.name=prism-apm-parser
server.port = 8090


# postgre
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_ENDPOINT:localhost:5432}/${DB_NAME:apm}?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
# producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# 10MB (10 * 1024 * 1024 = 10485760)
spring.kafka.producer.properties.max.request.size=10485760
# 64MB
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.compression-type=gzip
# consumer
spring.kafka.consumer.group-id=apm-span-parser
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.session.timeout.ms=6000
# listener
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=4



# logging
logging.custom.server.total-size-cap=50GB
logging.custom.server.max-file-size=100MB
logging.custom.server.max-history=30


# system
service.parse.check=false


cache.heap_percent=25
cache.timeout_s = 600
delay.component.local.thread_num=4
delay.component.local.batch_size=10
delay.component.local.batch_timeout_ms=1000


parser.kafka_topic = opentelemetry-trace
parser.reprocessing_kafka_topic = reprocessing-opentelemetry-trace

# MyBatis configuration
mybatis.type-handlers-package=org.prism.apm.parser.config.mybatis
mybatis.mapper-locations=classpath*:mybatis/mapper/**/*.xml
