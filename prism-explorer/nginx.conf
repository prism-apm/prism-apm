server {
    listen 80;
    root /usr/share/nginx/prism-explorer;
    index prism-explorer.html;

    location /prism-explorer/api/ {
        proxy_pass http://prism-explorer:8091;
        proxy_set_header Host $host;
    }
}

server {
    listen 8066;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ui-server:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}