##
# Docker-specific configuration
# Enable with --spring.profiles.active=docker at startup
##

spring.datasource.dynamic.primary = slave

spring.datasource.dynamic.datasource.master.url = jdbc:postgresql://timescaledb:5432/apm
spring.datasource.dynamic.datasource.master.username = postgres
spring.datasource.dynamic.datasource.master.password = postgres
spring.datasource.dynamic.datasource.master.driver-class-name = org.postgresql.Driver

spring.datasource.dynamic.datasource.slave.url = jdbc:postgresql://timescaledb:5432/apm
spring.datasource.dynamic.datasource.slave.username = postgres
spring.datasource.dynamic.datasource.slave.password = postgres
spring.datasource.dynamic.datasource.slave.driver-class-name = org.postgresql.Driver

jwt.secret = prismApmUiServerDistributedLoginSecretKey2025Ver
jwt.expiration = 86400000

apm.schedule.prewarm-enabled = false
apm.schedule.prewarm-function = run_hourly_db_task
apm.schedule.prewarm-cron = 0/3 * * * * ?
