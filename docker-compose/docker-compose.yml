networks:
  prism-apm-net:
    driver: bridge

services:
  postgres:
    image: timescale/timescaledb-ha:pg16.13-ts2.25.1
    networks:
      - prism-apm-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: apm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - prism-apm-timescaledb-data:/home/postgres/pgdata/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  zookeeper:
    image: bitnami/zookeeper:3.9.2
    networks:
      - prism-apm-net
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7.0
    networks:
      - prism-apm-net
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server 127.0.0.1:9092"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  jaeger-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.2
    networks:
      - prism-apm-net
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 15s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  jaeger-collector:
    image: jaegertracing/jaeger:2.8.0
    networks:
      - prism-apm-net
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./jaeger-collector-config.yml:/etc/jaeger/config.yml:ro
    command: ["--config", "/etc/jaeger/config.yml"]
    environment:
      KAFKA_BROKERS: kafka:9092
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "4317:4317"
      - "4318:4318"
      - "14250:14250"
      - "14268:14268"
      - "6831:6831"
      - "6832:6832"
      - "9411:9411"
      - "13133:13133"
      - "8888:8888"
    restart: unless-stopped

  jaeger-ingester:
    image: jaegertracing/jaeger:2.8.0
    networks:
      - prism-apm-net
    depends_on:
      kafka:
        condition: service_healthy
      jaeger-elasticsearch:
        condition: service_healthy
    volumes:
      - ./jaeger-other-config.yml:/etc/jaeger/config.yml:ro
    command: ["--config", "/etc/jaeger/config.yml"]
    environment:
      KAFKA_BROKERS: kafka:9092
      JAEGER_LISTEN_HOST: 0.0.0.0
      HEALTH_CHECK_PORT: 13134
      PROMETHEUS_PORT: 8889
      ES_SERVER_URLS: http://jaeger-elasticsearch:9200
    ports:
      - "16686:16686"
      - "13134:13134"
      - "8889:8889"
    restart: unless-stopped

  prism-apm-parser:
    image: prism-apm-parser
    networks:
      - prism-apm-net
    ports:
      - "8090:8090"
    environment:
      DB_ENDPOINT: postgres:5432
      DB_NAME: apm
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prism-apm-ui-server:
    image: prism-apm-ui-server
    networks:
      - prism-apm-net
    ports:
      - "8080:8080"
    environment:
      DB_WRITE_ENDPOINT: postgres:5432
      DB_WRITE_DB_NAME: apm
      DB_WRITE_USERNAME: postgres
      DB_WRITE_PASSWORD: postgres

      DB_READ_ENDPOINT: postgres:5432
      DB_READ_DB_NAME: apm
      DB_READ_USERNAME: postgres
      DB_READ_PASSWORD: postgres

      JWT_SECRET: change-me-change-me-change-me-change-me
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prism-apm-ui:
    image: prism-apm-ui
    networks:
      - prism-apm-net
    ports:
      - "8066:8066"
    environment:
      UI_SERVER_URL: http://prism-apm-ui-server:8080
    depends_on:
      - prism-apm-ui-server
    restart: unless-stopped

volumes:
  prism-apm-timescaledb-data: